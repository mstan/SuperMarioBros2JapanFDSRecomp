format_version = 1
id = "super-mario-bros-2-japan-fds.enhancement.widescreen"
version = "1.0.0"
name = "Super Mario Bros. 2 (Japan) Widescreen (Experimental)"
author = "NESRecomp"
description = "Custom widescreen rendering from a world-space level cache, on the cycle backend. Stock play keeps the original picture and game logic."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "super-mario-bros-2-japan-fds"
rom_crc32 = "f04cd4cd"

[[feature]]
id = "widescreen"
name = "Widescreen (Experimental)"
description = "Render extended terrain, ordinary enemies, piranha plants (both kinds), independent moving platforms and wind leaves. Choose original activation timing or movement throughout the visible area. Experimental; bosses, linked balance platforms and frenzy spawners still use native loading."
group = "Display"
exclusive_group = "display-mode"
default_enabled = false

[[plugin]]
feature = "widescreen"
id = "super-mario-bros-2-japan-fds.widescreen"

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect"
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit window (adaptive)"
[[option.choice]]
value = "16-9"
label = "16:9"
[[option.choice]]
value = "21-9"
label = "21:9"
[[option.choice]]
value = "32-9"
label = "32:9"

[[option]]
feature = "widescreen"
id = "camera"
label = "Camera"
type = "choice"
default = "edges"
[[option.choice]]
value = "edges"
label = "Anchor at area edges"
[[option.choice]]
value = "centered"
label = "Keep native view centered"

[[option]]
feature = "widescreen"
id = "hud"
label = "Status bar"
type = "choice"
default = "edges"
[[option.choice]]
value = "edges"
label = "Screen edges"
[[option.choice]]
value = "center"
label = "Centered"

[[option]]
feature = "widescreen"
id = "enemy_activation"
label = "Enemy movement"
type = "choice"
default = "viewport"
[[option.choice]]
value = "viewport"
label = "Move when loaded in the wide view"
[[option.choice]]
value = "classic"
label = "Preserve original 4:3 activation"
