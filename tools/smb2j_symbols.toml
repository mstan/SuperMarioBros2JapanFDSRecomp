smb2j_addr = "L_* 0xCACB-0xCBDA (8 areas), E_* 0xCA80-0xCABA (6)"
file = "SM2DATA3"
residency = "overlay region; present only while that file is loaded (SM2MAIN copy overlaid by the others)"
layout = "identical header (2 bytes: entrance/scenery/timer; terrain/bg/style) then objects, $FD terminator; enemy stream $FF terminated"
method = "labels in reference disassembly + header decode routine GetAreaDataAddrs flow match"

[[table]]
name = "EnemyAttributeData"
smb1_addr = 0xE85B
smb2j_addr = 0xB50A
file = "SM2MAIN"
residency = "always resident (PRG-RAM, WRITABLE)"
layout = "per-enemy-id attribute bytes"
method = "label"
notes = "SELF-MODIFIED at runtime by InitPiranhaPlant (+$0D) and EnemyGfxHandler (+$18..+$1A): host private-context runs do not restore PRG-RAM"

[[selfmod_write]]
routine = "InitPiranhaPlant"
instruction_addr = 0x93B4
op = "STA"
target = 0xB517
note = "write into PRG-RAM $6000-$DFFF from game code"

