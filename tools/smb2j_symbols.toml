# SMB1 (USA) -> SMB2J (Japan, FDS) symbol map for the SMB1 widescreen mod surface.
# Generated by a research script; contains addresses, names and counts only (no game bytes).
# Human summary: docs/SMB2J_SYMBOL_MAP.md

[meta]
smb1_rom = "Super Mario Bros. (USA).nes, PRG CRC32 D445F698 (NROM-256, $8000-$FFFF)"
smb2j_image = "Super Mario Bros. 2 (Japan) (Debug Value 0).fds, SHA1 3b8c8998b4887d6dd676965943d69a320738ab9c, fwNES, 1 side"
reference = "github.com/threecreepio/smb2j-disassembly (ca65 port of doppelganger disassembly); assembled with cc65 ca65/ld65 to a 65500-byte disk side that is byte-identical to the disk side of the image above (all 8 files), so its labels are authoritative for this image"
smb1_reference = "github.com/threecreepio/smb-disassembly + SuperMarioBrosRecomp/symbols.sym"
method = "recursive-descent instruction-sequence matching of each SMB1 routine against the SMB2J routine of the same label (operands normalised: ROM-range absolute operands abstracted, RAM/immediate operands compared literally), difflib-aligned; RAM variables confirmed from operand pairs of matched instructions; callee closure followed through JSR/JMP and JumpEngine tables (name-based pairing for tables because SMB2J tables are longer)"
address_notation = "all addresses are CPU addresses; SMB2J code is PRG-RAM $6000-$DFFF loaded from disk"

